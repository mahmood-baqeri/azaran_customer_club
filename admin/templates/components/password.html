<div class="{{item.c}}">
    <div class="form-group">
        {% if item.r  %}
            <span class="text-danger">*</span>
        {% endif %}
        <label class="mg-b-10" for="{{item.id}}"><b>{{item.l}}</b></label>
        <input type="password" class="form-control" autocomplete="off"
               name="{{item.n}}"
               placeholder="{{item.l}}"
               id="{{item.id}}"
               value=""
               {% if item.r  %} required {% endif %}
        >
    </div>
</div>
