<div class="{{item.c}}">
    <div class="form-group">
        {% if item.r  %}
            <span class="text-danger">*</span>
        {% endif %}
        <label class="mg-b-10" for="{{item.id}}"><b>{{item.l}}</b></label>
        <textarea class="form-control" rows="5"
                  name="{{item.n}}"
                  placeholder="{% if item.pl  %} {{ item.pl }} {% else %} {{item.l}} {% endif %}"
                  id="{{item.id}}"
                  {% if item.r  %} required {% endif %}
        >{% if item.v %}{{ item.v }}{% endif %}</textarea>
    </div>
</div>
