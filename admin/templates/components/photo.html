{% load static %}

<div class="{{item.c}}">
    <div class="form-group photoElementBox">
        {% if item.r  %}
            <span class="text-danger">*</span>
        {% endif %}
        <label><b>انتخاب تصویر</b></label>
        <label class="mg-b-10 mainLabel" for="{{item.id}}" style="width: 100%;padding: 8px;border-radius: 5px;background: white;border: 1px solid #eee">
            {{item.l}}
            <i class="fa fa-plus-circle"></i>
        </label>
        <input type="file" class="form-control border-left-0 browse-file d-none"
               name="{{item.n}}"
               id="{{item.id}}"
               data-viewer="#viewer_{{item.id}}"
               data-show=".viewerBox_{{item.id}}"
               {% if item.r  %} required {% endif %}
               accept=".jpg, .png, .jpeg, .gif, .bmp, .tif, .tiff|image/*"
        >
        <center class="viewerBox_{{item.id}} {% if item.v == '' %} d-none {% endif %}">
            <span class="removePhotoBtn"  style="position: absolute;border-radius: 0 5px 0 5px; width: 19px;  margin-right: 2px;height: 19px;margin-top: 22px; cursor: pointer; background: white;color: #f00; box-shadow: 0 0 0 2px red;">x</span>
            <img style="width: 90%;border: 1px solid; border-radius: 5px;margin: 20px 0;height: 200px;"
                 id="viewer_{{item.id}}"
                 {% if item.v %} src="/media/{{item.v}}" {% endif %}
                 onerror="this.src='{% static '/' %}images/banner.png'"
            />
        </center>
    </div>
</div>

{% block js %}
<script>
    id = "{{item.id}}";
    function readURL(input ,viewer) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function (e) {
                $(viewer).attr('src', e.target.result);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    $("#" + id).change(function () {
        $($(this).attr('data-show')).removeClass('d-none');
        readURL(this, $(this).attr('data-viewer'));
    });

    $('.removePhotoBtn').on('click', function () {
        $(this).next().attr('src', '');
        $(this).parent().addClass('d-none').siblings('input').val('');
    });
</script>
{% endblock %}
