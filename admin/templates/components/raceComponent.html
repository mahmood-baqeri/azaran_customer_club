{% load static %}
<div class="col-md-12 formComponentElement">
    <div class="row m--0">
        <h2>سوالات</h2>
    </div>
    <div class="row items">
        {% for question in item.questions %}
            <div class="col-12 newQuestion">
                <div class="row">
                    <input type="hidden" value="{{ question.id }}" name="questionID__{{ forloop.counter0  }}">
                    <div class="col-md-10 col-12 px-2">
                        <div class="form-group">
                            <label for=""><b>سوال</b></label>
                            <input type="text" class="form-control question" value="{{ question.question }}" name="question__{{ forloop.counter0 }}">
                        </div>
                    </div>
                    <div class="col-md-1 col-6 px-2">
                        <div class="form-group">
                            <label for="">اجباری بودن</label>
                            <label class="custom-switch" style="display: flex;flex-direction: column;align-items: flex-start;">
                                <input type="checkbox" class="custom-switch-input require" {% if question.require == 1 %} checked {% endif %} name="require__{{ forloop.counter0 }}">
                                <span class="custom-switch-indicator"></span>
                            </label>
                        </div>
                    </div>
                    <div class="col-md-1 col-6 px-2 text-center">
                        <i class="fa fa-times removeItem" data-id="{{ question.id }}"></i>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه یک</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item1 col-md-10" placeholder="گزینه" value="{{ question.item_1|default_if_none:'' }}">
                            <input type="number" class="form-control score1  col-md-2"  placeholder="امتیاز" value="{{ question.score_1 }}">
                        </div>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه دو</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item2 col-md-10" placeholder="گزینه" value="{{ question.item_2|default_if_none:'' }}">
                            <input type="number" class="form-control score2  col-md-2"  placeholder="امتیاز" value="{{ question.score_2 }}">
                        </div>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه سه</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item3 col-md-10" placeholder="گزینه" value="{{ question.item_3|default_if_none:'' }}">
                            <input type="number" class="form-control score3  col-md-2"  placeholder="امتیاز" value="{{ question.score_3 }}">
                        </div>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه چهار</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item4 col-md-10" placeholder="گزینه" value="{{ question.item_4|default_if_none:'' }}">
                            <input type="number" class="form-control score4  col-md-2"  placeholder="امتیاز" value="{{ question.score_4 }}">
                        </div>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه پنج</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item5 col-md-10" placeholder="گزینه" value="{{ question.item_5|default_if_none:'' }}">
                            <input type="number" class="form-control score5  col-md-2"  placeholder="امتیاز" value="{{ question.score_5 }}">
                        </div>
                    </div>

                    <div class="col-md-6 col-12 px-2 mb-4">
                        <p class="mb-1"><b>گزینه شش</b></p>
                        <div class="row m-0">
                            <input type="text" class="form-control item6 col-md-10" placeholder="گزینه" value="{{ question.item_6|default_if_none:'' }}">
                            <input type="number" class="form-control score6  col-md-2"  placeholder="امتیاز" value="{{ question.score_6 }}">
                        </div>
                    </div>

                </div>
            </div>
        {% endfor %}
    </div>

    <div class="row addSection">
        <div class="col-4 col-md-4">
            <button class="btn btn-outline-info" id="itemPlusNewBrnEl" type="button">افزودن</button>
        </div>
    </div>
</div>

<div class="col-12 col-md-12 d-none newQuestion">
    <div class="row">
        <div class="col-md-10 col-12 px-2">
            <div class="form-group">
                <label for=""><b>سوال</b></label>
                <input type="text" class="form-control question">
            </div>
        </div>
        <div class="col-md-1 col-6 px-2">
            <div class="form-group">
                <label for="">اجباری بودن</label>
                <label class="custom-switch" style="display: flex;flex-direction: column;align-items: flex-start;">
                    <input type="checkbox" class="custom-switch-input require" id="">
                    <span class="custom-switch-indicator"></span>
                </label>
            </div>
        </div>
        <div class="col-md-1 col-6 px-2 text-center">
            <i class="fa fa-times removeItem"></i>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه یک</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item1 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score1  col-md-2"  placeholder="امتیاز">
            </div>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه دو</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item2 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score2  col-md-2"  placeholder="امتیاز">
            </div>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه سه</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item3 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score3  col-md-2"  placeholder="امتیاز">
            </div>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه چهار</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item4 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score4  col-md-2"  placeholder="امتیاز">
            </div>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه پنج</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item5 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score5  col-md-2"  placeholder="امتیاز">
            </div>
        </div>

        <div class="col-md-6 col-12 px-2 mb-4">
            <p class="mb-1"><b>گزینه شش</b></p>
            <div class="row m-0">
                <input type="text" class="form-control item6 col-md-10" placeholder="گزینه">
                <input type="number" class="form-control score6  col-md-2"  placeholder="امتیاز">
            </div>
        </div>


    </div>
</div>

<script>
    $(document).ready(function () {
        $('#itemPlusNewBrnEl').on('click', function () {
            let newClone = $(".formComponentElement + .newQuestion").clone();
            newClone.removeClass('d-none');
            newClone.appendTo(".formComponentElement .items");
            handelPriority();
        });

        $('body').on('click', '.removeItem', function () {
            if ($(this).attr('data-id')) {
                let inputs = {
                    'id': $(this).attr('data-id'),
                };
                ajaxFunction("{{ item.deleteUrl }}", inputs, true).then((data) => {
                    $(this).parents('.newQuestion').remove();
                });
            } else
                $(this).parents('.newQuestion').remove();
            handelPriority();
        });

    });

    function handelPriority() {
        $('.formComponentElement .items .newQuestion').each(function (index, element) {
            $(element).find('.question').attr('name', "question__" + index).attr('require', true)
            $(element).find('.require').attr('name', "require__" + index)

            $(element).find('.item1').attr('name', "item1__" + index).attr('require', true)
            $(element).find('.score1').attr('name', "score1__" + index)
            $(element).find('.item2').attr('name', "item2__" + index).attr('require', true)
            $(element).find('.score2').attr('name', "score2__" + index)
            $(element).find('.item3').attr('name', "item3__" + index)
            $(element).find('.score3').attr('name', "score3__" + index)
            $(element).find('.item4').attr('name', "item4__" + index)
            $(element).find('.score4').attr('name', "score4__" + index)
            $(element).find('.item5').attr('name', "item5__" + index)
            $(element).find('.score5').attr('name', "score5__" + index)
            $(element).find('.item6').attr('name', "item6__" + index)
            $(element).find('.score6').attr('name', "score6__" + index)
        });
    }
    handelPriority();
</script>

<style>
    .formComponentElement {
        padding: 10px 0;
        margin: 23px 1%;
        max-width: 98%;
        box-shadow: 0 0 8px #ddd;
        border-radius: 10px;
    }

    .formComponentElement h2 {
        display: block;
        margin: 20px;
        font-weight: 700;
        padding: 15px;
        font-size: 25px;
        box-shadow: 0px 10px 16px #ddd;
    }

    .formComponentElement .items {
        margin: 0;
    }

    .formComponentElement .items > div {
        border-bottom: 1px solid #ddd;
        padding: 20px 15px;
    }

    .removeItem {
        position: relative;
        left: 15px;
        color: red;
        top: 25px;
        box-shadow: 0 0 4px red;
        padding: 8px 15px;
        border-radius: 3px;
        cursor: pointer;
    }

    .mediaBox .removeItem {
        top: -32px;
    }

    .addSection {
        margin: 0;
        padding: 20px 0;
    }
</style>
