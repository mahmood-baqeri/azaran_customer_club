<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
  table.dataTable thead th,
  table.dataTable thead td,
  table.dataTable tfoot th,
  table.dataTable tfoot td {
    text-align: right;
  }
</style>

<div class="col-12">
  <table id="datatable-element" class="display" style="width:100%">
    <thead>
      <tr>
        <th>نام</th>
        <th>نام خانوادگی</th>
        <th>کد پرسنلی</th>
        <th>موبایل</th>
        <th>کد ملی</th>
        <th>بخش</th>
        <th>واحد</th>
        <th></th>
      </tr>
    </thead>
  </table>

  <script>
    $(document).ready(function () {
      $('#datatable-element').DataTable({
        processing: true,
        serverSide: true,
        ajax: "{% url 'app_user:users-datatable' %}",
        columns: [{ data: 'first_name' }, { data: 'last_name' }, { data: 'personCode' }, { data: 'mobile' }, { data: 'nationalCode' }, { data: 'section' }, { data: 'unit' }, { data: 'actions' }],
        language: {
          url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/fa.json'
        },
        order: [[0, 'asc']]
      })
    })
  </script>
</div>
