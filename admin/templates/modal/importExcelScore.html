{% load static %}
{# بارگذاری داده از فایل اکسل #}
<div class="modal fade" id="importExcelScore">
  <div class="modal-dialog" role="document">
    <div class="modal-content modal-content-demo">
      <form method="post" enctype="multipart/form-data" action="{% url 'score:importExcel' %}">
        {% csrf_token %}

        <div class="modal-header">
          <h6 class="modal-title"><span>بارگذاری آذر از طریق فایل اکسل</span></h6>
          <button aria-label="Close" class="close" data-dismiss="modal" type="button"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
          <div>
            <h6>توجه !</h6>
            <p class="mb-4">
              <span>حتما ستون های فایل اکسل باید "کدپرسنلی/نام و نام خانوادگی/آذر" باشد.</span>
            </p>
          </div>

          <b>انتخاب اکسل</b>
          <input type="file" name="excel" class="form-control" accept=".xlsx" required />

          <br />

          <b>توضیح</b>
          <input type="text" name="description" class="form-control" required />
        </div>
        <div class="modal-footer">
          <button class="btn ripple btn-primary" type="submit">بارگذاری</button>
          <button class="btn ripple btn-secondary" data-dismiss="modal" type="button">بستن</button>
        </div>
      </form>
    </div>
  </div>
</div>
