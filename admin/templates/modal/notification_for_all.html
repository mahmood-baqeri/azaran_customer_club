{% if data.sendNotificationInGiftOrderForAll %}
  <div class="modal fade" id="sendNotificationInGiftOrderForAll">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content modal-content-demo">
        <form action="{% url 'gift:sendNotificationInGiftOrderForAll' %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="modal-header">
            <h6 class="modal-title">ارسال نوتیفیکیشن</h6>
            <button aria-label="Close" class="close" data-dismiss="modal" type="button"><span aria-hidden="true">&times;</span></button>
          </div>
          <div class="modal-body py-2 px-0 row m-0">
            {% for item in data.sendNotificationInGiftOrderForAllFields %}
              {% include 'components/'|add:item.b %}
            {% endfor %}
          </div>

          <div class="modal-footer">
            <button class="btn ripple btn-primary" type="submit">ارسال</button>
            <button class="btn ripple btn-secondary" data-dismiss="modal" type="button">بستن</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <style>
    .cke_1.cke_chrome,
    .cke_inner {
      height: 400px !important;
    }
    
    #cke_1_contents {
      height: 192px !important;
    }
  </style>
{% endif %}
