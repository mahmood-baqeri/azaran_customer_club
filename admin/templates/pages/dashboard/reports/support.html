{% for s in data.page %}
  <tr>
    <td>{{ s.id }}</td>
    <td>{{ s.subject|truncatechars:40 }}</td>
    <td>
      {{ s.user.full_name|default:'—' }}<br /><small class="text-muted" style="direction:ltr">{{ s.user.mobile }}</small>
    </td>
    <td>{{ s.get_category_display }}</td>
    <td>{{ s.get_priority_display }}</td>
    <td>{{ s.get_status_display }}</td>
    <td>
      <small>{{ s.created_at|date:'Y/m/d H:i' }}</small>
    </td>
  </tr>
{% empty %}
  <tr>
    <td colspan="7" class="text-center text-muted py-4">تیکتی یافت نشد</td>
  </tr>
{% endfor %}
